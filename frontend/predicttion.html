<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Predict Garbage Price</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <div class="container">

        <h1>Garbage Price Predictor</h1>

        <form id="predictionForm">

            <!-- State -->

            <label>State</label>

            <input
                type="text"
                id="state"
                placeholder="Enter state"
                required
            >


            <!-- City -->

            <label>City</label>

            <input
                type="text"
                id="city"
                placeholder="Enter city"
                required
            >


            <!-- Material -->

            <label>Material</label>

            <select id="material" required>

                <option value="">
                    Select Material
                </option>

                <option value="Copper">
                    Copper
                </option>

                <option value="Iron">
                    Iron
                </option>

                <option value="Aluminium">
                    Aluminium
                </option>

                <option value="Brass">
                    Brass
                </option>

                <option value="Plastic">
                    Plastic
                </option>

                <option value="Paper">
                    Paper
                </option>

            </select>


            <!-- Quality -->

            <label>Quality</label>

            <select id="quality" required>

                <option value="">
                    Select Quality
                </option>

                <option value="Good">
                    Good
                </option>

                <option value="Medium">
                    Medium
                </option>

                <option value="Poor">
                    Poor
                </option>

            </select>


            <!-- Weight -->

            <label>Weight (kg)</label>

            <input
                type="number"
                id="weight"
                placeholder="Enter weight"
                min="0.1"
                step="0.1"
                required
            >


            <!-- Date -->

            <label>Date</label>

            <input
                type="date"
                id="date"
                required
            >


            <button type="submit">
                Predict Price
            </button>

        </form>


        <!-- Result -->

        <div id="result"
             class="result">

        </div>

    </div>


    <script src="js/script.js"></script>

</body>

</html>
