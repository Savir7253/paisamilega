<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Book Pickup | ScrapSetu</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <div class="container">

        <h1>🚚 Book Scrap Pickup</h1>

        <p>
            Enter your scrap and pickup details.
        </p>


        <form id="pickupForm">

            <label>Material</label>

            <select id="material" required>

                <option value="">
                    Select Material
                </option>

                <option value="Copper">
                    Copper
                </option>

                <option value="Iron">
                    Iron
                </option>

                <option value="Aluminium">
                    Aluminium
                </option>

                <option value="Brass">
                    Brass
                </option>

                <option value="Plastic">
                    Plastic
                </option>

                <option value="Paper">
                    Paper
                </option>

            </select>


            <label>Quality</label>

            <select id="quality" required>

                <option value="">
                    Select Quality
                </option>

                <option value="Good">
                    Good
                </option>

                <option value="Medium">
                    Medium
                </option>

                <option value="Poor">
                    Poor
                </option>

            </select>


            <label>Weight (kg)</label>

            <input
                type="number"
                id="weight"
                min="0.1"
                step="0.1"
                placeholder="Example: 20"
                required
            >


            <label>State</label>

            <input
                type="text"
                id="state"
                placeholder="Enter state"
                required
            >


            <label>City</label>

            <input
                type="text"
                id="city"
                placeholder="Enter city"
                required
            >


            <label>Pickup Address</label>

            <textarea
                id="address"
                placeholder="Enter complete address"
                rows="4"
                required
            ></textarea>


            <label>Pickup Date</label>

            <input
                type="date"
                id="pickup_date"
                required
            >


            <label>Pickup Time</label>

            <input
                type="time"
                id="pickup_time"
                required
            >


            <button type="submit">
                Book Pickup
            </button>

        </form>


        <div id="pickupResult"
             class="result">
        </div>


        <button onclick="goDashboard()">
            ← Dashboard
        </button>

    </div>


    <script src="js/pickup.js"></script>

</body>

</html>
